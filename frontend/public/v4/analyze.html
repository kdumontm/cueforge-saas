<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrackCue — Analyze</title>
<link rel="stylesheet" href="/v4/shared.css">
<style>
  body{background-image:var(--aurora-calm)}
  .workspace{
    display:grid;
    grid-template-columns:240px 1fr 340px;
    gap:20px;
    margin-top:20px;
  }

  /* LEFT RAIL — Track list (queue / bookmarked) */
  .rail{
    display:flex;flex-direction:column;gap:10px;
    padding:16px;
    background:var(--s-1);border:1px solid var(--b-default);border-radius:16px;
    height:calc(100vh - 140px);
    position:sticky;top:80px;
    overflow:hidden;
  }
  .rail-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--b-subtle)}
  .rail-title{font-family:var(--font-display);font-weight:600;font-size:13px}
  .rail-count{font-family:var(--font-mono);font-size:11px;color:var(--c-tertiary)}
  .rail-tabs{display:flex;gap:2px;margin-bottom:8px}
  .rail-tabs button{
    flex:1;padding:7px 0;background:transparent;border:none;border-bottom:1px solid var(--b-subtle);
    font-family:var(--font-display);font-size:12px;color:var(--c-secondary);cursor:pointer;transition:all var(--t-fast)
  }
  .rail-tabs button.active{color:var(--c-primary);border-color:var(--amber)}
  .rail-list{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px;display:flex;flex-direction:column;gap:4px}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .rail-item{
    display:grid;grid-template-columns:32px 1fr 28px;gap:10px;align-items:center;
    padding:8px;border-radius:8px;cursor:pointer;
    transition:background var(--t-fast);
  }
  .rail-item:hover{background:var(--s-2)}
  .rail-item.current{background:linear-gradient(90deg,var(--amber-soft),transparent);border:1px solid rgba(255,122,24,.3)}
  .rail-item .cv{width:32px;height:32px;border-radius:5px;position:relative;overflow:hidden}
  .rail-item .cv::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(0,0,0,.15) 5px 7px)}
  .rail-item .tx{min-width:0}
  .rail-item .tx .n{font-size:12px;font-family:var(--font-display);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail-item .tx .a{font-size:11px;color:var(--c-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail-item .badge{font-family:var(--font-mono);font-size:10px;color:var(--c-tertiary);text-align:right}

  /* CENTER — analysis canvas */
  .canvas{display:flex;flex-direction:column;gap:16px;min-width:0}

  /* Track hero (compact) */
  .thero{
    display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;
    padding:12px 14px;border-radius:14px;
    background:linear-gradient(180deg,var(--s-2) 0%,var(--s-1) 100%);
    border:1px solid var(--b-default);
    box-shadow:var(--e-2);
    position:relative;overflow:hidden;
  }
  .thero::before{
    content:"";position:absolute;top:-60%;right:-5%;width:280px;height:280px;
    background:radial-gradient(circle,rgba(255,122,24,.08),transparent 60%);
    pointer-events:none;
  }
  .thero-cover{
    width:72px;height:72px;border-radius:10px;
    background:
      radial-gradient(at 30% 30%, rgba(255,255,255,.15), transparent 40%),
      linear-gradient(135deg,var(--pink) 0%,var(--amber) 60%,var(--violet) 100%);
    position:relative;overflow:hidden;box-shadow:var(--e-2);
    flex-shrink:0;
  }
  .thero-cover::after{
    content:"";position:absolute;inset:0;
    background:
      repeating-linear-gradient(45deg,transparent 0 10px,rgba(0,0,0,.12) 10px 12px),
      repeating-linear-gradient(-45deg,transparent 0 18px,rgba(255,255,255,.05) 18px 20px);
  }
  .thero-main{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;z-index:1}
  .thero-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--c-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thero-eyebrow .sep{margin:0 6px;color:var(--c-quaternary)}
  .thero-title{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-0.01em;line-height:1.1;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thero-title .editorial{color:var(--c-secondary);font-weight:400;font-size:16px;margin-left:6px}
  .thero-stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .stat-chip{
    padding:3px 8px;
    background:var(--s-3);
    border:1px solid var(--b-subtle);
    border-radius:8px;
    display:inline-flex;align-items:baseline;gap:5px;
  }
  .stat-chip .lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-tertiary)}
  .stat-chip .val{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--c-primary)}
  .stat-chip.accent{border-color:var(--amber-soft)}
  .stat-chip.accent .val{color:var(--amber)}
  .stat-chip.key .val{color:var(--cyan)}
  .stat-chip.energy .val{color:var(--pink)}
  .thero-right{display:flex;flex-direction:column;gap:6px;align-items:flex-end;position:relative;z-index:1}
  .quality-badge{
    display:flex;align-items:center;gap:6px;
    background:var(--green-soft);border:1px solid rgba(74,222,128,.3);
    border-radius:var(--r-pill);padding:3px 8px;
  }
  .quality-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
  .quality-badge .txt{font-family:var(--font-mono);font-size:10px;color:#8ef0aa;letter-spacing:.04em}
  .thero-actions{display:flex;gap:6px}

  /* Mode switcher */
  .mode-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 4px}
  .mode-row .left{display:flex;gap:10px;align-items:center}

  /* Toolbar */
  .toolbar{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 14px;
    background:var(--s-1);border:1px solid var(--b-default);border-radius:12px;
  }
  .tool-group{display:flex;gap:4px;align-items:center}
  .tool-sep{width:1px;height:20px;background:var(--b-default);margin:0 4px}
  .tool-btn{
    width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
    background:transparent;border:1px solid transparent;border-radius:7px;color:var(--c-secondary);
    cursor:pointer;transition:all var(--t-fast) var(--ease);
    position:relative;
  }
  .tool-btn:hover{background:var(--s-2);color:var(--c-primary)}
  .tool-btn.active{background:var(--amber-soft);border-color:rgba(255,122,24,.35);color:var(--amber)}
  .tool-btn svg{width:16px;height:16px;stroke-width:1.6}
  .tool-btn .kbd-mini{
    position:absolute;bottom:-4px;right:-4px;
    font-family:var(--font-mono);font-size:9px;color:var(--c-tertiary);
    background:var(--s-3);padding:1px 3px;border-radius:3px;border:1px solid var(--b-subtle);
    opacity:0;transition:opacity var(--t-fast);
  }
  .tool-btn:hover .kbd-mini{opacity:1}
  .zoom{display:flex;align-items:center;gap:8px;padding-right:6px}
  .zoom-label{font-family:var(--font-mono);font-size:11px;color:var(--c-tertiary);min-width:32px;text-align:right}

  /* Waveform block */
  .wave-block{
    background:var(--s-1);border:1px solid var(--b-default);border-radius:14px;
    padding:16px;overflow:hidden;position:relative;
  }
  /* Ruler + phrase markers */
  .ruler{
    height:28px;display:flex;align-items:stretch;position:relative;
    border-bottom:1px solid var(--b-subtle);margin-bottom:4px;
  }
  .phrase{
    flex:1;border-right:1px dashed var(--b-subtle);position:relative;
    display:flex;align-items:center;padding:0 6px;
    font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  }
  .phrase:last-child{border-right:none}
  .phrase.intro{color:var(--cyan);background:linear-gradient(180deg,transparent,rgba(31,212,212,0.05))}
  .phrase.verse{color:var(--c-tertiary)}
  .phrase.drop{color:var(--pink);background:linear-gradient(180deg,transparent,rgba(255,46,107,0.08))}
  .phrase.break{color:var(--violet);background:linear-gradient(180deg,transparent,rgba(139,92,246,0.05))}
  .phrase.outro{color:var(--amber);background:linear-gradient(180deg,transparent,rgba(255,122,24,0.05))}

  /* Main waveform */
  .wave{
    height:180px;position:relative;
    display:flex;align-items:center;gap:1px;
    padding:6px 0;
  }
  .wave .wbar{
    flex:1;min-width:1px;background:var(--c-quaternary);border-radius:1px;
    transition:background var(--t-fast);
  }
  .wave .wbar.played{background:linear-gradient(180deg,var(--amber),var(--pink))}
  .wave .wbar.active{background:var(--c-primary)}
  /* Playhead */
  .playhead{
    position:absolute;top:0;bottom:0;width:2px;background:var(--amber);
    box-shadow:0 0 12px var(--amber);z-index:10;pointer-events:none;
  }
  .playhead::before{
    content:"";position:absolute;top:-4px;left:-5px;width:12px;height:8px;
    background:var(--amber);clip-path:polygon(50% 100%,0 0,100% 0);
  }
  /* Cue markers */
  .cue-marker{
    position:absolute;top:0;bottom:0;z-index:5;cursor:pointer;
    transition:transform var(--t-fast) var(--ease);
  }
  .cue-marker:hover{z-index:20}
  .cue-line{position:absolute;top:24px;bottom:10px;left:50%;transform:translateX(-50%);width:2px;background:currentColor;opacity:.7}
  .cue-tip{
    position:absolute;top:-3px;left:50%;transform:translateX(-50%);
    width:22px;height:22px;border-radius:6px;
    background:currentColor;color:#050406;font-family:var(--font-mono);font-weight:600;font-size:10px;
    display:inline-flex;align-items:center;justify-content:center;
    border:2px solid var(--s-1);
    box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  .cue-label{
    position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
    font-family:var(--font-mono);font-size:10px;color:currentColor;white-space:nowrap;
  }
  .cue-marker.selected .cue-tip{outline:2px solid var(--c-primary);outline-offset:2px}
  .cue-marker[data-type=load]{color:var(--cue-load)}
  .cue-marker[data-type=hot]{color:var(--cue-hot)}
  .cue-marker[data-type=loop]{color:var(--cue-loop)}
  .cue-marker[data-type=fade]{color:var(--cue-fade)}
  .cue-marker[data-type=phrase]{color:var(--cue-phrase)}
  .cue-marker[data-type=beat]{color:var(--cue-beat)}

  /* Stems */
  .stems{margin-top:12px;padding-top:12px;border-top:1px solid var(--b-subtle);display:flex;flex-direction:column;gap:6px}
  .stem-row{display:grid;grid-template-columns:88px 1fr 64px;gap:10px;align-items:center;height:42px}
  .stem-meta{display:flex;align-items:center;gap:6px}
  .stem-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
  .stem-name{font-family:var(--font-mono);font-size:11px;color:var(--c-secondary);text-transform:uppercase;letter-spacing:.08em}
  .stem-wave{height:36px;display:flex;align-items:center;gap:1px;position:relative}
  .stem-wave .wbar{flex:1;min-width:1px;border-radius:1px;background:currentColor;opacity:.65;transition:opacity var(--t-fast)}
  .stem-row:hover .stem-wave .wbar{opacity:1}
  .stem-row.muted .stem-wave{opacity:.2}
  .stem-row[data-stem=drums]{color:var(--stem-drums)}
  .stem-row[data-stem=bass]{color:var(--stem-bass)}
  .stem-row[data-stem=vocals]{color:var(--stem-vocals)}
  .stem-row[data-stem=other]{color:var(--stem-other)}
  .stem-ctls{display:flex;gap:4px;justify-content:flex-end}
  .stem-ctls button{
    width:24px;height:24px;border-radius:5px;background:var(--s-2);border:1px solid var(--b-subtle);
    font-family:var(--font-mono);font-size:10px;color:var(--c-tertiary);cursor:pointer;transition:all var(--t-fast)
  }
  .stem-ctls button:hover{background:var(--s-3);color:var(--c-primary)}
  .stem-ctls button.on{background:currentColor;color:#050406;border-color:currentColor}

  /* Transport */
  .transport{
    display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;
    padding:14px 16px;
    background:var(--s-1);border:1px solid var(--b-default);border-radius:14px;
  }
  .tr-btns{display:flex;gap:6px;align-items:center}
  .tr-btn{
    width:36px;height:36px;border-radius:9px;background:var(--s-2);
    border:1px solid var(--b-subtle);color:var(--c-secondary);
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--t-fast)
  }
  .tr-btn:hover{background:var(--s-3);color:var(--c-primary)}
  .tr-btn.play{
    width:46px;height:46px;border-radius:50%;
    background:linear-gradient(180deg,#ff8a2e,var(--amber));color:#1a0b00;border:none;
    box-shadow:0 6px 20px rgba(255,122,24,.4),0 1px 0 rgba(255,255,255,.25) inset;
  }
  .tr-btn.play:hover{transform:scale(1.05)}
  .tr-btn svg{width:16px;height:16px;stroke-width:2}
  .tr-btn.play svg{width:18px;height:18px}

  .time-disp{
    display:flex;align-items:center;gap:16px;font-family:var(--font-mono);
  }
  .time-current{font-size:22px;color:var(--c-primary);font-weight:600;letter-spacing:-.01em}
  .time-total{font-size:13px;color:var(--c-tertiary)}
  .bar-bar{display:flex;flex-direction:column;gap:3px}
  .bar-bar .lbl{font-family:var(--font-mono);font-size:9px;color:var(--c-tertiary);letter-spacing:.12em;text-transform:uppercase}
  .bar-bar .val{font-family:var(--font-mono);font-size:13px;color:var(--c-primary)}

  .pads{display:flex;gap:4px}
  .pad{
    width:32px;height:32px;border-radius:7px;
    background:var(--s-2);border:1px solid var(--b-subtle);
    font-family:var(--font-mono);font-size:10px;color:var(--c-secondary);
    cursor:pointer;transition:all var(--t-fast);
    display:inline-flex;align-items:center;justify-content:center;font-weight:600;
  }
  .pad:hover{background:var(--s-3);color:var(--c-primary)}
  .pad.active{background:var(--cue-hot);color:#050406;border-color:var(--cue-hot);box-shadow:0 0 10px rgba(255,46,107,.5)}

  /* RIGHT INSPECTOR */
  .inspector{
    display:flex;flex-direction:column;gap:14px;
    position:sticky;top:80px;
    max-height:calc(100vh - 100px);
    overflow:hidden;
  }
  .insp-tabs{display:flex;gap:2px;padding:3px;background:var(--s-2);border:1px solid var(--b-default);border-radius:10px}
  .insp-tabs button{
    flex:1;padding:7px 10px;border:none;background:transparent;border-radius:7px;
    font-family:var(--font-display);font-size:12px;font-weight:500;color:var(--c-secondary);cursor:pointer;transition:all var(--t-fast)
  }
  .insp-tabs button.active{background:var(--s-4);color:var(--c-primary);box-shadow:var(--e-1)}

  .insp-panel{
    background:var(--s-1);border:1px solid var(--b-default);border-radius:12px;
    padding:16px;
    overflow-y:auto;
    flex:1;
  }
  .insp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .insp-title{font-family:var(--font-display);font-weight:600;font-size:14px}
  .insp-count{font-family:var(--font-mono);font-size:11px;color:var(--c-tertiary);background:var(--s-2);padding:2px 7px;border-radius:var(--r-pill)}

  .cue-list{display:flex;flex-direction:column;gap:4px}
  .cue-item{
    display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;
    padding:8px 10px;border-radius:8px;cursor:pointer;
    transition:background var(--t-fast);
    border-left:3px solid transparent;
  }
  .cue-item:hover{background:var(--s-2)}
  .cue-item.selected{background:var(--s-2);border-left-color:currentColor}
  .cue-item .tip{
    width:22px;height:22px;border-radius:5px;
    background:currentColor;color:#050406;
    font-family:var(--font-mono);font-size:10px;font-weight:600;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .cue-item .info{min-width:0}
  .cue-item .info .nm{font-family:var(--font-display);font-size:12.5px;font-weight:500;color:var(--c-primary)}
  .cue-item .info .mt{font-family:var(--font-mono);font-size:10.5px;color:var(--c-tertiary)}
  .cue-item .tm{font-family:var(--font-mono);font-size:11px;color:var(--c-secondary);text-align:right}
  .cue-item[data-type=load]{color:var(--cue-load)}
  .cue-item[data-type=hot]{color:var(--cue-hot)}
  .cue-item[data-type=loop]{color:var(--cue-loop)}
  .cue-item[data-type=fade]{color:var(--cue-fade)}
  .cue-item[data-type=phrase]{color:var(--cue-phrase)}
  .cue-item[data-type=beat]{color:var(--cue-beat)}

  .ai-sug{
    margin-top:14px;padding:12px;border-radius:10px;
    background:linear-gradient(135deg,rgba(139,92,246,0.12),rgba(31,212,212,0.08));
    border:1px solid rgba(139,92,246,0.25);
  }
  .ai-sug .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ai-sug .h .pill{
    font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:var(--r-pill);
    background:var(--violet-soft);color:#b9a3ff;border:1px solid rgba(139,92,246,.3);letter-spacing:.08em
  }
  .ai-sug .h strong{font-size:12.5px;font-family:var(--font-display);font-weight:600}
  .ai-sug p{margin:0 0 10px;font-size:12px;color:var(--c-secondary);line-height:1.5}
  .ai-sug-actions{display:flex;gap:6px}
</style>
</head>
<body>

<header class="topnav">
  <div class="topnav-brand">
    <span class="mark"></span><span>TrackCue</span>
  </div>
  <span class="topnav-sep"></span>
  <nav class="topnav-links">
    <a href="/">Overview</a>
    <a href="/analyze">Analyze</a>
    <a href="/library">Library</a>
    <a href="/compatible">Compatible</a>
    <a href="/set-builder">Set Builder</a>
    <a href="/mix-studio">Mix Studio</a>
    <a href="/stats">Stats</a>
    <a href="/upload">Upload</a>
    <a href="/settings">Settings</a>
    <a href="/admin">Admin</a>
  </nav>
  <div class="topnav-actions">
    <button class="btn btn-ghost btn-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Find<span class="kbd">⌘K</span></button>
    <button class="btn btn-primary btn-sm">Upload</button>
    <span class="topnav-sep"></span>
    <button class="avatar">··</button>
  </div>
</header>

<main class="page" style="max-width:1680px">

  <!-- MODE SWITCHER + BREADCRUMBS -->
  <div class="mode-row">
    <div class="left">
      <a href="/library" style="color:var(--c-tertiary);font-family:var(--font-mono);font-size:12px;display:inline-flex;align-items:center;gap:4px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Library
      </a>
      <span style="color:var(--c-quaternary);font-family:var(--font-mono);font-size:12px">/</span>
      <span id="breadcrumb-title" style="font-family:var(--font-mono);font-size:12px;color:var(--c-secondary)">—</span>
    </div>
    <div class="segment" id="mode-segment">
      <button class="active" data-mode="analyze"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h3l3-9 4 18 3-9h5"/></svg> Analyze<span class="kbd">1</span></button>
      <button data-mode="mix"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="12" r="4"/><circle cx="17" cy="12" r="4"/></svg> Mix<span class="kbd">2</span></button>
      <button data-mode="compare"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg> Compare<span class="kbd">3</span></button>
    </div>
  </div>

  <div class="workspace">

    <!-- LEFT RAIL -->
    <aside class="rail">
      <div class="rail-head">
        <span class="rail-title">Library</span>
        <span class="rail-count" id="rail-count">— · tracks</span>
      </div>
      <div class="rail-tabs" id="rail-tabs">
        <button class="active" data-tab="queue">Queue</button>
        <button data-tab="fav">Fav</button>
        <button data-tab="recent">Recent</button>
      </div>
      <div class="rail-list" id="rail-list"></div>
    </aside>

    <!-- CENTER CANVAS -->
    <section class="canvas">

      <!-- Track hero -->
      <div class="thero reveal">
        <div class="thero-cover"></div>
        <div class="thero-main">

<script>
if(!api.requireAuth()) throw new Error('redirect');

// Parse track id
const params = new URLSearchParams(location.search);
let trackId = params.get('id');

// State
let currentTrack = null;
let currentCues = [];
let currentDurMs = 0;
let audioEl = null;
let audioBlobUrl = null;
let playheadTimer = null;

// Fallback : convertit analysis.key (ex. "Am", "C#m") vers un code Camelot quand camelot_code est null
const NOTE_TO_CAMELOT = {
  'Abm':'1A','G#m':'1A','B':'1B','Ebm':'2A','D#m':'2A','F#':'2B','Gb':'2B',
  'Bbm':'3A','A#m':'3A','Db':'3B','C#':'3B','Fm':'4A','Ab':'4B','G#':'4B',
  'Cm':'5A','Eb':'5B','D#':'5B','Gm':'6A','Bb':'6B','A#':'6B','Dm':'7A','F':'7B',
  'Am':'8A','C':'8B','Em':'9A','G':'9B','Bm':'10A','D':'10B',
  'F#m':'11A','Gbm':'11A','A':'11B','C#m':'12A','Dbm':'12A','E':'12B'
};
function parseKeyToCamelot(k){
  if(!k || typeof k !== 'string') return null;
  const clean = k.trim().replace(/\s+/g,'').replace(/^([a-g])/i, s => s.toUpperCase());
  return NOTE_TO_CAMELOT[clean] || null;
}

// Main wave — buildWave wipe innerHTML, donc on ré-ajoute le playhead APRES
const wave = document.getElementById('wave');
function rebuildWaveFromPeaks(peaks){
  // Si on a des peaks réelles, on construit la waveform exacte
  wave.innerHTML = '';
  const count = Array.isArray(peaks) && peaks.length ? peaks.length : 380;
  for(let i=0;i<count;i++){
    const h = Array.isArray(peaks) && peaks.length
      ? Math.min(1, Math.max(0.06, Math.abs(Number(peaks[i]) || 0)))
      : (() => {
          const phrase = Math.floor(i/(count/8));
          const contours = [0.55,0.68,1.0,0.5,0.72,1.0,0.42,0.58];
          const base = contours[phrase]||0.6;
          return Math.min(1, base * (0.6+0.4*Math.sin((i/count)*Math.PI*6)));
        })();
    const b = document.createElement('div');
    b.className = 'wbar';
    b.style.height = (h*100)+'%';
    wave.appendChild(b);
  }
  // ré-ajouter le playhead (buildWave l'a supprimé via innerHTML = '')
  const ph = document.createElement('div');
  ph.className = 'playhead';
  ph.style.left = '0%';
  wave.appendChild(ph);
}
rebuildWaveFromPeaks(null);

// Stems (visuels décoratifs)
function buildStemWave(id, seed, style){
  const el = document.getElementById(id);
  if(!el) return;
  el.innerHTML = '';
  const count = 220;
  for(let i=0;i<count;i++){
    let h = 0.2;
    const r = seededRand(seed+i*0.21);
    if(style==='beat'){
      const step = i%8;
      h = (step===0||step===4)?0.95:(step===2||step===6)?0.5:0.15+r*.3;
    } else if(style==='sub'){
      h = 0.4+0.5*Math.sin(i*.14)+r*.15;
    } else if(style==='mid'){
      h = 0.15 + (Math.sin(i*.07)>.3?.65+r*.2:.2*r);
    } else {
      h = 0.2+r*.5;
    }
    h = Math.max(.1,Math.min(1,h));
    const b = document.createElement('div');
    b.className='wbar';
    b.style.height = (h*100)+'%';
    el.appendChild(b);
  }
}
buildStemWave('stem-drums', 3.3, 'beat');
buildStemWave('stem-bass', 11.1, 'sub');
buildStemWave('stem-vocals', 19.9, 'mid');
buildStemWave('stem-other', 5.5, 'air');

/* ========== Rail : vraies pistes de l'utilisateur ========== */
const covers = [
  'linear-gradient(135deg,#8b5cf6,#1fd4d4)',
  'linear-gradient(135deg,#ff7a18,#ff2e6b)',
  'linear-gradient(135deg,#1fd4d4,#d4ff2a)',
  'linear-gradient(135deg,#ff2e6b,#8b5cf6)',
  'linear-gradient(135deg,#d4ff2a,#ff7a18)',
  'linear-gradient(135deg,#6366f1,#ff2e6b)'
];
const railEl = document.getElementById('rail-list');
const railCountEl = document.getElementById('rail-count');

let railTab = 'queue'; // queue | fav | recent
let railEpoch = 0; // 🔴 Fix #114 : empêche les réponses stale d'écraser le panel après un switch rapide

async function loadRail(){
  const myEpoch = ++railEpoch;
  railEl.innerHTML = '<div style="padding:12px;text-align:center;color:var(--c-tertiary);font-size:12px">Chargement…</div>';
  try {
    let items = [];
    if(railTab === 'fav'){
      const fav = await api.get('/favorites');
      if(myEpoch !== railEpoch) return; // abandonné : un autre tab a été cliqué entre-temps
      items = (fav && (fav.items || fav.tracks || (Array.isArray(fav) ? fav : []))) || [];
    } else if(railTab === 'recent'){
      const list = await api.tracks({ limit: 30, sort: '-last_played_at' });
      if(myEpoch !== railEpoch) return;
      // 🔴 Fix 2026-04-21 : /tracks renvoie {tracks,total,page,pages}
      items = Array.isArray(list) ? list : (list?.items || list?.tracks || list?.results || []);
    } else {
      const list = await api.tracks({ limit: 30, sort: '-created_at' });
      if(myEpoch !== railEpoch) return;
      items = Array.isArray(list) ? list : (list?.items || list?.tracks || list?.results || []);
    }
    if(myEpoch !== railEpoch) return;
    railCountEl.textContent = `${items.length} · tracks`;
    railEl.innerHTML = '';
    items.forEach((t,i)=>{
      const d = document.createElement('div');
      const isCurrent = String(t.id) === String(trackId);
      d.className = 'rail-item pressable'+(isCurrent?' current':'');
      const title = t.title || t.original_filename || t.filename || 'Sans titre';
      const artist = t.artist || '—';
      const bpm = t.analysis && t.analysis.bpm ? Number(t.analysis.bpm).toFixed(0) : '—';
      const key = t.camelot_code || (t.analysis && t.analysis.key) || '—';
      d.innerHTML = `
        <div class="cv" style="background:${covers[i%covers.length]}"></div>
        <div class="tx"><div class="n"></div><div class="a"></div></div>
        <div class="badge">${bpm}<br>${key}</div>
      `;
      d.querySelector('.n').textContent = title;
      d.querySelector('.a').textContent = artist;
      d.addEventListener('click',()=>{
        location.href = `/analyze?id=${t.id}`;
      });
      railEl.appendChild(d);
    });
    if(items.length === 0){
      const msg = railTab === 'fav' ? 'Aucun favori.' : railTab === 'recent' ? 'Aucune piste jouée récemment.' : 'Aucune piste.';
      railEl.innerHTML = `<div style="padding:12px;text-align:center;color:var(--c-tertiary);font-size:12px">${msg} <a href="/upload" style="color:var(--amber)">Uploader</a></div>`;
    }
  } catch(err){
    if(myEpoch !== railEpoch) return;
    railCountEl.textContent = 'err';
    railEl.innerHTML = `<div style="padding:12px;color:var(--pink);font-size:12px">Erreur : ${err.message}</div>`;
  }
}

// Rail tabs
document.querySelectorAll('#rail-tabs button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#rail-tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    railTab = b.dataset.tab || 'queue';
    loadRail();
  });
});

/* ========== Hero + cues : vraie piste ========== */
function formatDur(ms){
  if(!ms || isNaN(ms)) return '—';
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60);
  const rem = s%60;
  return `${m}:${String(rem).padStart(2,'0')}`;
}

function renderCueMarkers(cues, durationMs){
  const waveEl = document.getElementById('wave');
  // Supprimer les cue-markers existants
  waveEl.querySelectorAll('.cue-marker').forEach(n=>n.remove());
  if(!cues || cues.length === 0 || !durationMs) return;

  cues.forEach((c, i)=>{
    const pct = Math.max(0, Math.min(100, (c.time_ms / durationMs) * 100));
    const type = (c.type || 'hot').toLowerCase();
    const el = document.createElement('div');
    el.className = 'cue-marker'+(i===0?' selected':'');
    el.dataset.type = type;
    el.style.left = pct+'%';
    const tipLabel = c.label ? c.label.substring(0,1) : (type==='loop'?'⟲':type==='fade'?'F':type==='phrase'?'P':type==='beat'?'B':type==='load'?'L':String(i+1));
    const caption = c.label || type;
    el.innerHTML = `<div class="cue-tip"></div><div class="cue-line"></div><div class="cue-label"></div>`;
    el.querySelector('.cue-tip').textContent = tipLabel;
    el.querySelector('.cue-label').textContent = caption;
    waveEl.appendChild(el);
  });
}

function renderCueList(cues){
  const listEl = document.querySelector('.cue-list');
  const cuesTab = document.querySelector('.insp-tabs button[data-tab="cues"]');
  const inspCount = document.querySelector('.insp-count');
  if(!listEl) return;
  listEl.innerHTML = '';
  if(cuesTab) cuesTab.textContent = `Cues · ${cues?.length || 0}`;
  if(inspCount) inspCount.textContent = `${cues?.length || 0} actifs`;

  if(!cues || cues.length === 0){
    listEl.innerHTML = '<div style="padding:12px;text-align:center;color:var(--c-tertiary);font-size:12px">Aucun cue point détecté</div>';
    return;
  }
  cues.forEach((c, i)=>{
    const type = (c.type || 'hot').toLowerCase();
    const tipLabel = c.label ? c.label.substring(0,1) : (type==='loop'?'⟲':type==='fade'?'F':type==='phrase'?'P':type==='beat'?'B':type==='load'?'L':String(i+1));
    const item = document.createElement('div');
    item.className = 'cue-item'+(i===0?' selected':'');
    item.dataset.type = type;
    item.innerHTML = `
      <span class="tip"></span>
      <div class="info"><div class="nm"></div><div class="mt"></div></div>
      <div class="tm"></div>
    `;
    item.querySelector('.tip').textContent = tipLabel;
    item.querySelector('.nm').textContent = c.label || `Cue ${i+1}`;
    item.querySelector('.mt').textContent = c.description || type;
    const sec = (c.time_ms || 0)/1000;
    const m = Math.floor(sec/60);
    const s = (sec%60).toFixed(1);
    item.querySelector('.tm').textContent = `${m}:${String(s).padStart(4,'0')}`;
    listEl.appendChild(item);
  });
}

async function loadTrack(){
  if(!trackId){
    // Pas de track — on prend la première du user
    try {
      const list = await api.tracks({ limit: 1 });
      // 🔴 Fix 2026-04-21 : /tracks renvoie {tracks,total,page,pages}
      const items = Array.isArray(list) ? list : (list?.items || list?.tracks || list?.results || []);
      if(items[0]){
        trackId = items[0].id;
        history.replaceState(null, '', `/analyze?id=${trackId}`);
      } else {
        document.getElementById('thero-title').textContent = 'Aucune piste disponible';
        document.getElementById('thero-genre').textContent = 'Uploadez votre première piste';
        return;
      }
    } catch(err){
      document.getElementById('thero-title').textContent = 'Erreur de chargement';
      return;
    }
  }

  try {
    const t = await api.track(trackId);
    currentTrack = t;
    const title = t.title || t.original_filename || t.filename || 'Sans titre';
    const artist = t.artist || '—';
    const album = t.album || '';
    const genre = t.genre || '—';
    const a = t.analysis || {};
    const bpm = a.bpm != null ? Number(a.bpm).toFixed(1) : '—';
    const camelotResolved = t.camelot_code || parseKeyToCamelot(a.key);
    const key = camelotResolved ? `${camelotResolved}${a.key ? ' · '+a.key : ''}` : (a.key || '—');
    // Énergie normalisée sur l'échelle 0-10 (aligne avec compatible/set-builder)
    const energyRaw = a.energy != null ? Number(a.energy) : null;
    const energy = energyRaw == null ? '—' : (energyRaw > 1.0 ? (energyRaw/10).toFixed(1) : (energyRaw*10).toFixed(1));
    const durMs = a.duration_ms || t.duration_ms;
    currentDurMs = durMs || 0;
    const cues = t.cue_points || [];
    currentCues = cues;

    document.getElementById('breadcrumb-title').textContent = title;
    document.title = `TrackCue — ${title}`;
    document.getElementById('thero-title').textContent = title;
    document.getElementById('thero-bpm').textContent = bpm;
    document.getElementById('thero-key').textContent = key;
    document.getElementById('thero-energy').textContent = energy;
    document.getElementById('thero-duration').textContent = formatDur(durMs);
    document.getElementById('thero-status').textContent = t.status || '—';
    document.getElementById('thero-cues').textContent = cues.length;

    // Afficher bouton "Lancer l'analyse" si la piste n'est pas analysée
    // 🔴 Fix 2026-04-21 : on se fie UNIQUEMENT à la présence de bpm dans analysis.
    // Le backend renvoie status='completed' (pas 'analyzed'/'ready'), donc check
    // par status est trompeur. Si analysis.bpm existe, c'est analysé, point.
    // On masque aussi pendant 'analyzing'/'pending' pour éviter double-click.
    const btnLaunch = document.getElementById('btn-launch-analyze');
    if(btnLaunch){
      const hasBpm = t.analysis && t.analysis.bpm != null;
      const inProgress = t.status === 'analyzing' || t.status === 'pending';
      const needsAnalysis = !hasBpm && !inProgress;
      btnLaunch.style.display = needsAnalysis ? '' : 'none';
    }

    const eyebrow = document.getElementById('thero-eyebrow');
    const src = t.acoustid_id ? 'AcoustID' : (t.musicbrainz_id ? 'MusicBrainz' : (t.spotify_id ? 'Spotify' : null));
    eyebrow.innerHTML = '';
    const parts = [];
    if(genre && genre !== '—') parts.push(genre);
    if(artist && artist !== '—') parts.push(artist);
    if(album) parts.push(album);
    parts.forEach((p, i)=>{
      if(i>0){
        const sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = '·';
        eyebrow.appendChild(sep);
      }
      const span = document.createElement('span');
      span.textContent = p;
      eyebrow.appendChild(span);
    });
    if(src){
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '·';
      eyebrow.appendChild(sep);
      const badge = document.createElement('span');
      badge.style.color = 'var(--green)';
      badge.textContent = `● ${src}`;
      eyebrow.appendChild(badge);
    }

    // Quality badge — réel, venant de analysis.audio_quality_score / _grade
    const qBadge = document.getElementById('quality-badge');
    const qTxt = document.getElementById('quality-txt');
    if(a.audio_quality_score != null){
      const score = Math.round(Number(a.audio_quality_score));
      const grade = a.audio_quality_grade || (score >= 85 ? 'high-fidelity' : score >= 70 ? 'good' : score >= 50 ? 'standard' : 'low');
      qTxt.textContent = `Qualité ${score} · ${grade}`;
      qBadge.style.display = '';
    } else if(a.encoding_quality){
      qTxt.textContent = `Qualité · ${a.encoding_quality}`;
      qBadge.style.display = '';
    } else {
      qBadge.style.display = 'none';
    }

    // Waveform réelle — utiliser analysis.waveform_peaks si dispo
    if(a.waveform_peaks && Array.isArray(a.waveform_peaks) && a.waveform_peaks.length > 0){
      rebuildWaveFromPeaks(a.waveform_peaks);
    } else {
      // Reset le playhead au moins, au cas où on a changé de piste
      const ph = wave.querySelector('.playhead');
      if(ph) ph.style.left = '0%';
    }

    // Phrase ruler — réel, à partir de section_labels + structural_summary
    renderPhraseRuler(a.section_labels, durMs);

    // Transport time
    document.getElementById('time-total').textContent = ` / ${formatDur(durMs)}`;
    document.getElementById('time-current').textContent = '0:00.0';
    document.getElementById('bar-beat').textContent = durMs ? '1 · 1' : '—';
    document.getElementById('cues-count-transport').textContent = cues.length;

    // Cues
    renderCueMarkers(cues, durMs);
    renderCueList(cues);
    renderMetaPanel(t);
    renderAudioPanel(a);

    // Réattacher les handlers de cue après re-render
    attachCueHandlers();
  } catch(err){
    document.getElementById('thero-title').textContent = 'Erreur : '+err.message;
    toast(`Chargement impossible : ${err.message}`, 'error');
  }
}

// Render phrase ruler from analysis.section_labels
// section_labels peut être : ["intro","verse","drop","break",...] OU [{label:'intro', bars:16}, ...]
function renderPhraseRuler(labels, durMs){
  const ruler = document.getElementById('phrase-ruler');
  if(!ruler) return;
  ruler.innerHTML = '';
  if(!Array.isArray(labels) || labels.length === 0){
    // Pas d'analyse structurelle — on cache le ruler
    ruler.style.display = 'none';
    return;
  }
  ruler.style.display = '';
  labels.forEach(l => {
    const d = document.createElement('div');
    let lab, bars;
    if(typeof l === 'string'){ lab = l; bars = null; }
    else { lab = l.label || l.name || 'section'; bars = l.bars || l.length_bars; }
    const key = String(lab).toLowerCase();
    let cls = 'verse';
    if(key.includes('intro')) cls = 'intro';
    else if(key.includes('drop') || key.includes('chorus')) cls = 'drop';
    else if(key.includes('break') || key.includes('breakdown')) cls = 'break';
    else if(key.includes('outro')) cls = 'outro';
    d.className = 'phrase '+cls;
    d.textContent = bars ? `${lab} · ${bars}` : lab;
    ruler.appendChild(d);
  });
}

// ========== Audio engine (WebAudio API) ==========
// Chrome's HTML5 <audio> element stalle systématiquement à ~3230ms sur notre
// endpoint /audio malgré Range 206 valide (testé 2026-04-21). Donc on utilise
// WebAudio + AudioBufferSourceNode qui fonctionne parfaitement (decodeAudioData
// réussit en ~500ms sur les mêmes bytes). On expose un wrapper qui mime l'API
// HTMLAudioElement (paused/play/pause/currentTime/addEventListener) pour que
// le reste du code reste inchangé.
function createWebAudioPlayer(audioBuffer){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const listeners = { ended: [], timeupdate: [] };
  let source = null;
  let gainNode = ctx.createGain();
  gainNode.connect(ctx.destination);
  let _paused = true;
  let _startOffset = 0;      // position dans le buffer au dernier play() (en s)
  let _startCtxTime = 0;     // ctx.currentTime au dernier play()
  let _duration = audioBuffer.duration;
  let _timeupdateTimer = null;

  function currentTime(){
    if(_paused) return _startOffset;
    return _startOffset + (ctx.currentTime - _startCtxTime);
  }

  function fireTimeupdate(){
    listeners.timeupdate.forEach(fn => { try { fn(); } catch(e){} });
  }

  function startTimer(){
    if(_timeupdateTimer) return;
    _timeupdateTimer = setInterval(fireTimeupdate, 100); // 10Hz, proche d'un <audio>
  }
  function stopTimer(){
    if(_timeupdateTimer){ clearInterval(_timeupdateTimer); _timeupdateTimer = null; }
  }

  function stopSource(){
    if(source){
      try { source.onended = null; source.stop(); } catch(e){}
      try { source.disconnect(); } catch(e){}
      source = null;
    }
  }

  async function _play(){
    if(!_paused) return;
    // ctx.resume() DOIT être awaited pour que l'audio sorte réellement
    // (Chrome autoplay policy : resume ne prend effet qu'après await lors d'un user gesture)
    if(ctx.state === 'suspended'){
      try { await ctx.resume(); } catch(e){}
    }
    // AudioBufferSourceNode ne peut être joué qu'une fois → on en recrée un à chaque play()
    stopSource();
    source = ctx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(gainNode);
    source.onended = () => {
      // Distingue fin naturelle vs pause() manuelle (pause stop source + reset onended)
      if(!_paused){
        _paused = true;
        _startOffset = _duration;
        stopTimer();
        fireTimeupdate();
        listeners.ended.forEach(fn => { try { fn(); } catch(e){} });
      }
    };
    const offset = Math.min(Math.max(0, _startOffset), _duration - 0.01);
    source.start(0, offset);
    _startCtxTime = ctx.currentTime;
    _paused = false;
    startTimer();
  }

  function _pause(){
    if(_paused) return;
    const pos = currentTime();
    _startOffset = Math.min(pos, _duration);
    _paused = true;
    stopSource();
    stopTimer();
  }

  function _seek(sec){
    const target = Math.max(0, Math.min(sec, _duration));
    const wasPlaying = !_paused;
    if(wasPlaying){
      stopSource();
      _startOffset = target;
      _startCtxTime = ctx.currentTime;
      source = ctx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(gainNode);
      source.onended = () => {
        if(!_paused){
          _paused = true;
          _startOffset = _duration;
          stopTimer();
          fireTimeupdate();
          listeners.ended.forEach(fn => { try { fn(); } catch(e){} });
        }
      };
      source.start(0, target);
    } else {
      _startOffset = target;
    }
    fireTimeupdate();
  }

  // Wrapper compatible <audio>
  return {
    get paused(){ return _paused; },
    get duration(){ return _duration; },
    get currentTime(){ return currentTime(); },
    set currentTime(v){ _seek(Number(v) || 0); },
    play(){ return _play(); },
    pause(){ _pause(); },
    addEventListener(ev, fn){
      if(listeners[ev]) listeners[ev].push(fn);
    },
    removeEventListener(ev, fn){
      if(listeners[ev]){
        const i = listeners[ev].indexOf(fn);
        if(i >= 0) listeners[ev].splice(i, 1);
      }
    },
    _ctx: ctx,
    _buffer: audioBuffer,
    _destroy(){ stopSource(); stopTimer(); try { ctx.close(); } catch(e){} }
  };
}

async function ensureAudio(){
  if(audioEl) return audioEl;
  if(!trackId) return null;
  try {
    // 1. Fetch bytes avec JWT
    const tok = typeof api.token === 'function' ? api.token() : '';
    let resp = await fetch(`/api/v1/tracks/${trackId}/audio`, {
      headers: tok ? { 'Authorization': 'Bearer ' + tok } : {}
    });
    if(!resp.ok && resp.status === 401){
      try { await api.me(); } catch {}
      const tok2 = typeof api.token === 'function' ? api.token() : '';
      resp = await fetch(`/api/v1/tracks/${trackId}/audio`, {
        headers: tok2 ? { 'Authorization': 'Bearer ' + tok2 } : {}
      });
    }
    if(!resp.ok) throw new Error('HTTP '+resp.status);

    // 2. Decode via WebAudio (fonctionne là où <audio> stalle)
    const arrayBuf = await resp.arrayBuffer();
    const ctxTmp = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuffer = await ctxTmp.decodeAudioData(arrayBuf);
    try { ctxTmp.close(); } catch(e){}

    // 3. Wrapper compatible <audio>
    audioEl = createWebAudioPlayer(audioBuffer);
    audioEl.addEventListener('ended', () => setPlayingUI(false));
    audioEl.addEventListener('timeupdate', updatePlayheadUI);
    return audioEl;
  } catch(err){
    toast('Lecture impossible : '+err.message, 'warn');
    return null;
  }
}

function setPlayingUI(playing){
  const svg = playBtn.querySelector('svg');
  if(playing){
    svg.innerHTML='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
    playBtn.dataset.playing='1';
  } else {
    svg.innerHTML='<path d="M6 4v16l14-8z"/>';
    playBtn.dataset.playing='0';
  }
}

function fmtTimeCurrent(sec){
  const m = Math.floor(sec/60);
  const s = (sec%60).toFixed(1).padStart(4,'0');
  return `${m}:${s}`;
}

function updatePlayheadUI(){
  if(!audioEl || !currentDurMs) return;
  const t = audioEl.currentTime;
  document.getElementById('time-current').textContent = fmtTimeCurrent(t);
  // Playhead
  const ph = wave.querySelector('.playhead');
  if(ph){
    const pct = Math.min(100, (t * 1000 / currentDurMs) * 100);
    ph.style.left = pct + '%';
  }
  // Bar · Beat
  const a = currentTrack && currentTrack.analysis || {};
  const bpm = a.bpm;
  if(bpm){
    const beatSec = 60 / bpm;
    const beatIdx = Math.floor(t / beatSec);
    const bar = Math.floor(beatIdx / 4) + 1;
    const beat = (beatIdx % 4) + 1;
    document.getElementById('bar-beat').textContent = `${bar} · ${beat}`;
  }
}

  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg> Analyse…';
  btn.disabled = true;
  let timeoutId;
  const timeoutPromise = new Promise((_, reject) => {
    timeoutId = setTimeout(() => reject(new Error('timeout')), 30000);
  });
  try {
    const res = await Promise.race([
      api.get(`/tracks/${trackId}/suggest-cues`),
      timeoutPromise,
    ]);
    const items = (res && (res.suggestions || res.cues || (Array.isArray(res) ? res : []))) || [];
    const ai = document.getElementById('ai-sug');
    const title = document.getElementById('ai-sug-title');
    const body = document.getElementById('ai-sug-body');
    if(items.length === 0){
      toast('Aucune suggestion AI', 'info');
      ai.style.display = 'none';
      return;
    }
    title.textContent = `${items.length} cue${items.length>1?'s':''} suggéré${items.length>1?'s':''}`;
    const summary = items.slice(0, 3).map(c => {
      const t = c.position_ms || c.time_ms || 0;
      const sec = (t/1000).toFixed(1);
      return `${c.name || c.label || c.cue_type || 'cue'} @ ${sec}s`;
    }).join(' · ');
    body.textContent = summary + (items.length > 3 ? ` et ${items.length - 3} autres` : '');
    ai.style.display = '';
    ai.dataset.suggestions = JSON.stringify(items);
  } catch(err){
    if(/timeout/i.test(err.message || '')){
      toast('AI suggest : timeout (30s) — réessayez', 'warn');
    } else {
      toast('AI suggest : '+err.message, 'warn');
    }
  } finally {
    clearTimeout(timeoutId);
    btn.innerHTML = origHtml;
    btn.disabled = false;
  }
});

  const originalTxt = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg> Analyse…';

    // Polling : vérifier toutes les 3s, max 40 essais (2 min)

      attempts++;
      try {
        const t = await api.track(trackId);
        const a = t.analysis || {};
        if(a.bpm != null || t.status === 'analyzed' || t.status === 'ready'){
          clearInterval(pollId);
          btn.disabled = false;
          btn.textContent = originalTxt;
          await loadTrack();
          toast('Analyse terminée · '+(a.bpm ? Number(a.bpm).toFixed(1)+' BPM' : 'OK'), 'success');
        } else if(attempts >= 40){
          clearInterval(pollId);
          btn.disabled = false;
          btn.textContent = originalTxt;
          toast('Analyse toujours en cours — rafraîchissez dans 1 min', 'warn');
        }
      } catch(err){
        // Network blip pendant polling — on continue
        if(attempts >= 40){
          clearInterval(pollId);
          btn.disabled = false;
          btn.textContent = originalTxt;
        }
      }
    }, 3000);
  } catch(err){
    btn.disabled = false;
    btn.textContent = originalTxt;
    toast('Analyse impossible : '+err.message, 'error');
  }
});

// ========== Seek bar — click sur waveform ==========
wave.addEventListener('click', async (e) => {
  const rect = wave.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const a = await ensureAudio();
  if(a && currentDurMs){
    a.currentTime = (pct * currentDurMs) / 1000;
    updatePlayheadUI();
  }
});

// Keyboard shortcuts
document.addEventListener('keydown',(e)=>{
  if(/input|textarea/i.test(document.activeElement?.tagName||'')) return;
  if(e.code==='Space'){e.preventDefault();playBtn.click();}
  else if(e.code === 'ArrowLeft'){ document.querySelector('.tr-btn[data-tt^="Prev"]')?.click(); }
  else if(e.code === 'ArrowRight'){ document.querySelector('.tr-btn[data-tt^="Next"]')?.click(); }
  else if(e.key === '1' || e.key === '2' || e.key === '3'){
    const seg = document.querySelectorAll('#mode-segment button');
    seg[parseInt(e.key) - 1]?.click();
  }
});

// Cleanup audio on unload
window.addEventListener('beforeunload', () => {
  if(audioBlobUrl){ URL.revokeObjectURL(audioBlobUrl); }
});
</script>
