<style>
  body { background: var(--s-0); min-height: 100vh; }

    border-bottom: 1px solid var(--b-default);
  }
  .topnav-inner { max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--amber), var(--pink));
    display: grid; place-items: center;

  .topnav-links a:hover { color: var(--c-primary); }

  .hero { max-width: 960px; margin: 0 auto; padding: 64px 24px 32px; text-align: center; }

  }
  .hero h1 {
    font-family: var(--font-display);
    font-size: 52px; font-weight: 700; letter-spacing: -0.03em;
    margin: 0 0 14px; color: var(--c-primary);
  }
  .hero h1 em { font-family: var(--font-serif); font-style: italic; color: var(--amber); font-weight: 400; }
  .hero p { color: var(--c-secondary); font-size: 17px; margin: 0 auto; max-width: 540px; line-height: 1.6; }

  .filters {
    max-width: 1200px; margin: 0 auto 24px;

    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center;
  }
  .filter-chip {
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
    background: var(--s-1);
    border: 1px solid var(--b-default);
    color: var(--c-secondary);
    cursor: pointer;
    transition: all .15s ease;
  }
  .filter-chip:hover { color: var(--c-primary); border-color: var(--b-hover); }
  .filter-chip.active {
    background: rgba(255,176,77,.1);
    border-color: rgba(255,176,77,.35);
    color: var(--amber);
  }

  .grid {
    max-width: 1200px; margin: 0 auto;
    padding: 32px 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
  }
  .post {
    background: var(--s-1);
    border: 1px solid var(--b-default);
    border-radius: 16px;
    overflow: hidden;
    transition: all .2s ease;
    display: flex; flex-direction: column;
    text-decoration: none;
    color: inherit;
  }
  .post:hover {
    border-color: var(--b-hover);
    transform: translateY(-2px);
    box-shadow: 0 20px 40px -20px rgba(0,0,0,.5);
  }
  .post .cover {
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, rgba(255,176,77,.08), rgba(255,107,157,.08));
    position: relative;
    overflow: hidden;
  }
  .post .cover img { width: 100%; height: 100%; object-fit: cover; }
  .post .cover.placeholder {
    display: grid; place-items: center;
    color: var(--c-tertiary);
  }
  .post .body {
    padding: 20px 22px 22px;
    display: flex; flex-direction: column; gap: 10px;
    flex: 1;
  }
  .post .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .post .tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(255,176,77,.12);
    color: var(--amber);
  }
  .post h2 {
    font-family: var(--font-display);
    font-size: 19px; font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--c-primary);
    line-height: 1.3;
  }
  .post p {
    margin: 0;
    font-size: 14px;
    color: var(--c-secondary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .post .meta {
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid var(--b-default);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px;
    color: var(--c-tertiary);
    font-family: var(--font-mono);
  }

  .empty, .loading {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--c-tertiary);
  }
  .empty h3 { font-family: var(--font-display); color: var(--c-primary); font-size: 22px; margin: 0 0 8px; }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--b-default);
    border-top-color: var(--amber);
    animation: spin .8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .hero { padding: 40px 20px 20px; }
    .hero h1 { font-size: 36px; }
    .grid { padding: 20px 20px 60px; gap: 18px; }

  }

<body>

<div class="topnav">

<section class="hero">
  <div class="eyebrow">Le blog</div>
  <h1>Astuces, tutos <em>& insights</em></h1>
  <p>Tout ce qu'il faut savoir pour tirer le meilleur de TrackCue — des workflows de préparation aux techniques de mix harmonique.</p>
</section>

<div class="filters" id="filters"></div>

<div class="grid" id="grid">
  <div class="loading">
    <div class="spinner"></div>
    Chargement des articles…
  </div>
</div>

<script src="/v4/shared.js?v=20260511-w16"></script>

<script src="/v4/api.js?v=20260423c"></script>
<script>
(function(){
  var grid = document.getElementById('grid');
  var filters = document.getElementById('filters');

  var state = { posts: [], activeTag: null };

  function formatDate(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch(e) { return ''; }
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function postCard(p) {
    var slug = p.slug || p.id || '';
    var url = p.url || ('/blog/' + encodeURIComponent(slug));
    var cover = p.cover_url || p.image_url || p.cover || '';
    var tags = Array.isArray(p.tags) ? p.tags : (typeof p.tags === 'string' ? p.tags.split(',').map(function(t){return t.trim();}) : []);
    var tagsHtml = tags.slice(0, 3).map(function(t){ return '<span class="tag">'+escapeHtml(t)+'</span>'; }).join('');
    var excerpt = p.excerpt || p.summary || p.description || '';
    var author = p.author || p.author_name || 'TrackCue';
    var date = p.published_at || p.created_at || p.date;

    return '' +
      '<a href="'+escapeHtml(url)+'" class="post">' +
        '<div class="cover '+(cover?'':'placeholder')+'">' +
          (cover
            ? '<img src="'+escapeHtml(cover)+'" alt="" loading="lazy">'
            : '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/><path d="M14 2v5h5M2 15h10M9 18l3-3-3-3"/></svg>') +
        '</div>' +
        '<div class="body">' +
          (tagsHtml ? '<div class="tags">'+tagsHtml+'</div>' : '') +
          '<h2>'+escapeHtml(p.title || 'Sans titre')+'</h2>' +
          (excerpt ? '<p>'+escapeHtml(excerpt)+'</p>' : '') +
          '<div class="meta">' +
            '<span>'+escapeHtml(author)+'</span>' +
            (date ? '<span>'+formatDate(date)+'</span>' : '') +
          '</div>' +
        '</div>' +
      '</a>';
  }

  function allTags(posts) {
    var set = {};
    posts.forEach(function(p){
      var tags = Array.isArray(p.tags) ? p.tags : (typeof p.tags === 'string' ? p.tags.split(',').map(function(t){return t.trim();}) : []);
      tags.forEach(function(t){ if (t) set[t] = (set[t]||0)+1; });
    });
    return Object.keys(set).sort(function(a,b){ return set[b]-set[a]; });
  }

  function renderFilters() {
    var tags = allTags(state.posts);
    if (!tags.length) { filters.style.display = 'none'; return; }
    var html = '<button class="filter-chip '+(state.activeTag===null?'active':'')+'" data-tag="">Tous</button>';
    tags.forEach(function(t){
      html += '<button class="filter-chip '+(state.activeTag===t?'active':'')+'" data-tag="'+escapeHtml(t)+'">'+escapeHtml(t)+'</button>';
    });
    filters.innerHTML = html;
    filters.querySelectorAll('.filter-chip').forEach(function(el){
      el.addEventListener('click', function(){
        var t = el.getAttribute('data-tag') || null;
        state.activeTag = t;
        renderFilters();
        renderGrid();
      });
    });
  }

  function renderGrid() {
    var list = state.posts;
    if (state.activeTag) {
      list = list.filter(function(p){
        var tags = Array.isArray(p.tags) ? p.tags : (typeof p.tags === 'string' ? p.tags.split(',') : []);
        return tags.map(function(t){return String(t).trim();}).indexOf(state.activeTag) >= 0;
      });
    }
    if (!list.length) {
      grid.innerHTML = '<div class="empty"><h3>Aucun article pour le moment</h3><p>Revenez bientôt — on prépare du contenu pour vous.</p></div>';
      return;
    }
    grid.innerHTML = list.map(postCard).join('');
  }

  function fallbackPosts() {
    return [
      {
        title: "Mixer en harmonique avec la roue de Camelot",
        excerpt: "Apprenez à enchaîner vos morceaux sans fausse note grâce à la roue de Camelot et aux conseils de compatibilité de TrackCue.",
        tags: ["Mixing", "Théorie"],
        author: "TrackCue",
        published_at: "2026-04-15",
        slug: "mixage-harmonique-camelot",
        cover_url: "",
      },
      {
        title: "Préparer un set festival en 1h avec TrackCue",
        excerpt: "Un workflow minute pour analyser, classer et préparer tous vos tracks avant un gros gig — sans stress.",
        tags: ["Workflow", "Festival"],
        author: "TrackCue",
        published_at: "2026-04-02",
        slug: "preparer-set-festival-1h",
        cover_url: "",
      },
      {
        title: "Stems, mashups et créativité : le Studio est là",
        excerpt: "Notre Mashup Studio fait de la parité avec MIK 11 Pro — découvrez ce qu'on peut en tirer pour créer vos propres edits.",
        tags: ["Mashup", "Features"],
        author: "TrackCue",
        published_at: "2026-03-22",
        slug: "mashup-studio-creativite",
        cover_url: "",
      },
      {
        title: "Cue points : auto vs manuel, comment choisir ?",
        excerpt: "TrackCue détecte automatiquement vos intros, drops et outros — quand faut-il faire confiance à l'IA et quand ajuster à la main ?",
        tags: ["Cue Points", "Mixing"],
        author: "TrackCue",
        published_at: "2026-03-10",
        slug: "cue-points-auto-vs-manuel",
        cover_url: "",
      },
      {
        title: "Export Rekordbox, Serato, Traktor : guide complet",
        excerpt: "Comment pousser vos tracks analysés dans votre logiciel de DJ préféré — avec les cue points et BPM corrects.",
        tags: ["Export", "Workflow"],
        author: "TrackCue",
        published_at: "2026-02-28",
        slug: "export-rekordbox-serato-traktor",
        cover_url: "",
      },
      {
        title: "Le set harmonique parfait : BPM, key, énergie",
        excerpt: "Les 3 dimensions qui font un set qui respire — et comment TrackCue vous aide à les orchestrer en une interface.",
        tags: ["Théorie", "Set"],
        author: "TrackCue",
        published_at: "2026-02-14",
        slug: "set-harmonique-parfait",
        cover_url: "",
      },
    ];
  }

  function load() {
    if (!window.api || !api.get) {
      state.posts = fallbackPosts();
      renderFilters();
      renderGrid();
      return;
    }
    api.get('/blog', { limit: 100 }).then(function(r){
      var posts = [];
      if (Array.isArray(r)) posts = r;
      else if (r && Array.isArray(r.posts)) posts = r.posts;
      else if (r && Array.isArray(r.items)) posts = r.items;
      else if (r && Array.isArray(r.results)) posts = r.results;
      else if (r && Array.isArray(r.data)) posts = r.data;

      if (!posts.length) posts = fallbackPosts();
      state.posts = posts;
      renderFilters();
      renderGrid();
    }).catch(function(){
      state.posts = fallbackPosts();
      renderFilters();
      renderGrid();
    });
  }

  load();
})();
</script>
</body>
</html>
