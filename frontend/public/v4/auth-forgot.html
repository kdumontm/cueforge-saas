<body>
<div class="auth-wrap">
  <a href="/" class="auth-brand">
    <span class="logo">T</span>
    <span class="wordmark">TrackCue</span>
  </a>

  <div class="auth-card reveal">
    <div id="form-view">
      <div class="head-row">
        <a href="/login" class="back-link" aria-label="Retour">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <h1 class="auth-title">Mot de passe oublié</h1>
      </div>
      <p class="auth-sub">Entre ton email et on t'envoie un lien pour réinitialiser ton mot de passe.</p>

      <div id="alert" class="alert" style="display:none" role="alert"></div>

      <form id="forgot-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" class="input" type="email" placeholder="ton@email.com" required autocomplete="email" autofocus>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-submit">Envoyer le lien</button>
      </form>
    </div>

    <div id="done-view" class="success" style="display:none">
      <div class="icon">✓</div>
      <h2>Email envoyé !</h2>
      <p>Si un compte existe pour <strong id="sent-email" style="color:var(--c-primary)"></strong>, tu recevras un lien de réinitialisation dans quelques minutes.</p>
      <a href="/login" class="back-cta">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Retour à la connexion
      </a>
    </div>
  </div>
</div>

<script src="/v4/api.js?v=20260423b"></script>
<script src="/v4/shared.js?v=20260427-autoupdate"></script>
<script src="/v4/transitions.js?v=20260430-tc1" defer></script>
<script src="/v4/transitions-pack3.js?v=20260430-tc1" defer></script>
<script src="/v4/improvements.js?v=20260503-imp3" defer></script>
<script>
(function(){
  var alertBox = document.getElementById('alert');
  var btn = document.getElementById('submit-btn');
  var emailEl = document.getElementById('email');

  function showError(msg){ alertBox.textContent = msg; alertBox.style.display = 'block'; }
  function clearError(){ alertBox.style.display = 'none'; }

  document.getElementById('forgot-form').addEventListener('submit', function(e){
    e.preventDefault();
    clearError();
    var email = emailEl.value.trim();
    if (!email) return;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-inline"></span>Envoi…';

    fetch('/api/v1/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    })
      .then(function(r){ if (!r.ok) throw new Error('Erreur'); return r.json(); })
      .then(function(){
        document.getElementById('sent-email').textContent = email;
        document.getElementById('form-view').style.display = 'none';
        document.getElementById('done-view').style.display = 'block';
      })
      .catch(function(){
        // Toujours afficher comme succès pour ne pas révéler l'existence d'un compte
        document.getElementById('sent-email').textContent = email;
        document.getElementById('form-view').style.display = 'none';
        document.getElementById('done-view').style.display = 'block';
      });
  });
})();
</script>
</body>
