      radial-gradient(900px 500px at 50% -8%, rgba(255,46,107,.18), transparent 60%),

  @keyframes tc-spin { to { transform: rotate(360deg); } }

<body>
<div class="auth-wrap">
  <a href="/" class="auth-brand">
    <span class="logo">T</span>
    <span class="wordmark">TrackCue</span>
  </a>

  <div class="auth-card reveal">
    <div id="invalid-view" class="invalid-card" style="display:none">
      <p>Lien invalide ou expiré.</p>
      <p style="margin-top:10px"><a href="/forgot-password">Recommencer</a></p>
    </div>

    <div id="form-view">
      <h1 class="auth-title">Nouveau mot de passe</h1>
      <div id="alert" class="alert" style="display:none" role="alert"></div>
      <form id="reset-form">
        <div class="field">
          <label for="password">Nouveau mot de passe</label>
          <div class="pwd-wrap">
            <input id="password" class="input" type="password" placeholder="Minimum 8 caractères" required autocomplete="new-password" style="padding-right:64px">
            <button type="button" class="pwd-toggle" id="pwd-toggle" aria-label="Afficher le mot de passe">Voir</button>
          </div>
        </div>
        <div class="field">
          <label for="confirm">Confirmer</label>
          <input id="confirm" class="input" type="password" placeholder="••••••••" required autocomplete="new-password">
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-submit">Enregistrer</button>
      </form>
    </div>

    <div id="done-view" class="success" style="display:none">
      <div class="icon">✓</div>
      <h2>Mot de passe mis à jour !</h2>
      <p>Redirection vers la connexion…</p>
    </div>
  </div>
</div>

<script src="/v4/api.js?v=20260423b"></script>
<script src="/v4/shared.js?v=20260427-autoupdate"></script>
<script src="/v4/transitions.js?v=20260430-tc1" defer></script>
<script src="/v4/transitions-pack3.js?v=20260430-tc1" defer></script>
<script src="/v4/improvements.js?v=20260503-imp2" defer></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  if (!token){
    document.getElementById('form-view').style.display = 'none';
    document.getElementById('invalid-view').style.display = 'block';
    return;
  }

  var alertBox = document.getElementById('alert');
  var btn = document.getElementById('submit-btn');
  var pwdEl = document.getElementById('password');
  var confEl = document.getElementById('confirm');

  function showError(msg){ alertBox.textContent = msg; alertBox.style.display = 'block'; }
  function clearError(){ alertBox.style.display = 'none'; }

  document.getElementById('pwd-toggle').addEventListener('click', function(){
    var show = pwdEl.type === 'password';
    pwdEl.type = show ? 'text' : 'password';
    confEl.type = show ? 'text' : 'password';
    this.textContent = show ? 'Masquer' : 'Voir';
  });

  document.getElementById('reset-form').addEventListener('submit', function(e){
    e.preventDefault();
    clearError();
    var pwd = pwdEl.value, conf = confEl.value;
    if (pwd.length < 8) { showError('Minimum 8 caractères'); return; }
    if (pwd !== conf) { showError('Les mots de passe ne correspondent pas'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-inline"></span>Mise à jour…';

    fetch('/api/v1/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, new_password: pwd })
    })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
      .then(function(res){
        if (!res.ok) throw new Error(res.data && res.data.detail || 'Lien invalide ou expiré');
        document.getElementById('form-view').style.display = 'none';
        document.getElementById('done-view').style.display = 'block';
        setTimeout(function(){ location.replace('/login'); }, 2500);
      })
      .catch(function(err){
        showError(err.message || 'Lien invalide ou expiré');
        btn.disabled = false; btn.textContent = 'Enregistrer';
      });
  });
})();
</script>
</body>
</html>
