<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion — TrackCue</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=/login">
<script>
  // Préserve ?next= si présent, puis redirige vers la page de login Next.js
  var p = new URLSearchParams(location.search);
  var next = p.get('next') || '';
  var dest = '/login' + (next ? ('?next=' + encodeURIComponent(next)) : '');
  location.replace(dest);
</script>
