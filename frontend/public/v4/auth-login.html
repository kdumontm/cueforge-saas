<script>
// Redirige si déjà connecté
if(api.isAuthed()){
  const next = new URLSearchParams(location.search).get('next') || '/dashboard';
  location.replace(next);
}

const $ = (id) => document.getElementById(id);

function showAlert(msg, type='error'){
  const a = $('alert');
  a.className = 'alert alert-'+type;
  a.textContent = msg;
  a.style.display = '';
}
function hideAlert(){ $('alert').style.display='none'; }

// Toggle password
$('pwd-toggle').addEventListener('click', () => {
  const p = $('password');
  const show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('pwd-toggle').textContent = show ? 'Masquer' : 'Voir';
});

// OAuth callback handling
(function handleOAuthCallback(){
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if(!code) return;
  const provider = params.has('state') ? 'spotify' : 'google';
  $('submit-btn').disabled = true;
  $('submit-btn').innerHTML = '<span class="spinner-inline"></span>Connexion OAuth…';
  fetch(`/api/v1/auth/oauth/${provider}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ code, redirect_uri: location.origin+'/login' })
  }).then(r => r.json()).then(d => {
    if(d.access_token){
      localStorage.setItem('trackcue_token', d.access_token);
      if(d.refresh_token) localStorage.setItem('trackcue_refresh', d.refresh_token);
      location.replace('/dashboard');
    } else {
      showAlert(d.detail || 'OAuth échoué');
      $('submit-btn').disabled = false;
      $('submit-btn').textContent = 'Se connecter';
    }
  }).catch(() => {
    showAlert('Erreur OAuth');
    $('submit-btn').disabled = false;
    $('submit-btn').textContent = 'Se connecter';
  });
  history.replaceState({}, '', '/login');
})();

// Login submit
$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAlert();
  $('resend-box').style.display = 'none';
  const username = $('username').value.trim();
  const password = $('password').value;
  const btn = $('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span>Connexion…';
  try {
    const res = await fetch('/api/v1/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ identifier: username, password })
    });
    const d = await res.json().catch(() => ({}));
    if(res.ok && d.access_token){
      localStorage.setItem('trackcue_token', d.access_token);
      if(d.refresh_token) localStorage.setItem('trackcue_refresh', d.refresh_token);
      const next = new URLSearchParams(location.search).get('next') || '/dashboard';
      location.replace(next);
      return;
    }
    if(res.status === 403){
      showAlert('Email non vérifié. Entre ton email ci-dessous pour recevoir un nouveau lien.');
      $('resend-box').style.display = '';
      if(username.includes('@')) $('resend-email').value = username;
    } else {
      const msg = d.detail || d.message || '';
      showAlert(msg && !/invalid/i.test(msg) ? msg : 'Identifiant ou mot de passe incorrect');
    }
  } catch {
    showAlert('Erreur réseau. Réessaie.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
});

// Resend verification
$('resend-btn').addEventListener('click', async () => {
  const email = $('resend-email').value.trim();
  if(!email) return;
  $('resend-btn').disabled = true;
  $('resend-btn').innerHTML = '<span class="spinner-inline"></span>Envoi…';
  try {
    await fetch('/api/v1/auth/resend-verify', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    showAlert('Lien envoyé ! Vérifie ta boîte de réception (et les spams).', 'success');
    $('resend-box').style.display = 'none';
  } catch {} finally {
    $('resend-btn').disabled = false;
    $('resend-btn').textContent = 'Envoyer le lien';
  }
});

// OAuth triggers
$('oauth-google').addEventListener('click', () => {
  const clientId = window.__GOOGLE_CLIENT_ID || '';
  if(!clientId){ showAlert('Google OAuth non configuré. Contacte le support.'); return; }
  const redirect = location.origin + '/login';
  location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirect)}&response_type=code&scope=openid%20email%20profile&access_type=offline`;
});
$('oauth-spotify').addEventListener('click', () => {
  const clientId = window.__SPOTIFY_CLIENT_ID || '';
  if(!clientId){ showAlert('Spotify OAuth non configuré. Contacte le support.'); return; }
  const redirect = location.origin + '/login';
  location.href = `https://accounts.spotify.com/authorize?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirect)}&response_type=code&scope=user-read-email%20user-read-private&state=spotify`;
});
</script>
