<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="55%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="bg" cx="30%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#050407"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Pulse mark (big, left side) -->
  <g transform="translate(310,315)">
    <g fill="url(#g)">
      <rect x="-4" y="-180" width="8" height="52" rx="3" transform="rotate(0)"/>
      <rect x="-4" y="-180" width="8" height="78" rx="3" transform="rotate(15)"/>
      <rect x="-4" y="-180" width="8" height="38" rx="3" transform="rotate(30)"/>
      <rect x="-4" y="-180" width="8" height="104" rx="3" transform="rotate(45)"/>
      <rect x="-4" y="-180" width="8" height="68" rx="3" transform="rotate(60)"/>
      <rect x="-4" y="-180" width="8" height="86" rx="3" transform="rotate(75)"/>
      <rect x="-4" y="-180" width="8" height="52" rx="3" transform="rotate(90)"/>
      <rect x="-4" y="-180" width="8" height="94" rx="3" transform="rotate(105)"/>
      <rect x="-4" y="-180" width="8" height="60" rx="3" transform="rotate(120)"/>
      <rect x="-4" y="-180" width="8" height="78" rx="3" transform="rotate(135)"/>
      <rect x="-4" y="-180" width="8" height="42" rx="3" transform="rotate(150)"/>
      <rect x="-4" y="-180" width="8" height="94" rx="3" transform="rotate(165)"/>
      <rect x="-4" y="-180" width="8" height="68" rx="3" transform="rotate(180)"/>
      <rect x="-4" y="-180" width="8" height="86" rx="3" transform="rotate(195)"/>
      <rect x="-4" y="-180" width="8" height="52" rx="3" transform="rotate(210)"/>
      <rect x="-4" y="-180" width="8" height="104" rx="3" transform="rotate(225)"/>
      <rect x="-4" y="-180" width="8" height="60" rx="3" transform="rotate(240)"/>
      <rect x="-4" y="-180" width="8" height="78" rx="3" transform="rotate(255)"/>
      <rect x="-4" y="-180" width="8" height="34" rx="3" transform="rotate(270)"/>
      <rect x="-4" y="-180" width="8" height="94" rx="3" transform="rotate(285)"/>
      <rect x="-4" y="-180" width="8" height="52" rx="3" transform="rotate(300)"/>
      <rect x="-4" y="-180" width="8" height="68" rx="3" transform="rotate(315)"/>
      <rect x="-4" y="-180" width="8" height="86" rx="3" transform="rotate(330)"/>
      <rect x="-4" y="-180" width="8" height="42" rx="3" transform="rotate(345)"/>
    </g>
    <circle cx="0" cy="0" r="44" fill="#ffffff"/>
  </g>

  <!-- Wordmark + tagline (right side) -->
  <g transform="translate(560,260)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, SF Pro Display, Inter, system-ui, sans-serif" font-weight="800" font-size="96" letter-spacing="-4">TrackCue</text>
    <text x="0" y="62" fill="#b4b4be" font-family="-apple-system, SF Pro Display, Inter, system-ui, sans-serif" font-weight="500" font-size="28" letter-spacing="-0.5">Analyse audio intelligente pour DJs</text>
    <rect x="0" y="96" width="68" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="140" fill="#8a8a93" font-family="-apple-system, SF Pro Display, Inter, system-ui, sans-serif" font-weight="400" font-size="20" letter-spacing="-0.2">BPM, cue points, stems &#x2022; Export Rekordbox / Serato / Traktor</text>
  </g>

  <!-- Bottom badge -->
  <g transform="translate(560,525)">
    <rect x="0" y="0" width="230" height="36" rx="18" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.4)" stroke-width="1"/>
    <circle cx="22" cy="18" r="4" fill="#10f5a6"/>
    <text x="38" y="24" fill="#e8e8ea" font-family="-apple-system, SF Pro Display, Inter, system-ui, sans-serif" font-weight="600" font-size="14" letter-spacing="0.02em">trackcue.app</text>
  </g>
</svg>
