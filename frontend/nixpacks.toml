# Nixpacks config for Railway — frontend Next.js 14 standalone
# Last reset: 2026-04-22 (clean rebuild after 6 consecutive failed deploys)

[variables]
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
CI = "true"
NEXT_TELEMETRY_DISABLED = "1"
# Prevents Railway from passing --production to npm ci (causes EUSAGE on Node 22 / npm 10)
NPM_CONFIG_PRODUCTION = "false"
# NODE_OPTIONS is also injected in package.json build script for reliability
NODE_OPTIONS = "--max-old-space-size=4096"
# Next.js standalone server binds to HOSTNAME — doit être 0.0.0.0 pour que
# Railway edge puisse atteindre le container (sinon 502 x-railway-fallback)
HOSTNAME = "0.0.0.0"

[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x"]

[phases.install]
cmds = ["npm ci --prefer-offline --no-audit"]

[phases.build]
cmds = ["npm run build"]

[start]
# standalone output: copy static + public assets then start Node server
cmd = "cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public && node .next/standalone/server.js"
