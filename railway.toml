[build]
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "cd /app && gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --preload --max-requests 200 --max-requests-jitter 50 --timeout 180"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
